spring.application.name=KisanFinTech

server.port=${PORT:8080}


# =====================================================
# ML SERVICES
# =====================================================

# Existing crop recommendation ML service
ml.api.url=https://ml-model-jyo0.onrender.com/

# Pesticide prediction ML service
pesticide.ml.api.url=https://kisan-pesticide-ml.onrender.com/


# =====================================================
# WEATHER
# =====================================================

weather.api.key=8f3011bd1d6949079b6142407262809
weather.api.days=3
weather.api.url=https://api.weatherapi.com/v1/forecast.json


# =====================================================
# GEOCODING
# =====================================================

geocoding.api.url=https://nominatim.openstreetmap.org/search
geocoding.user-agent=KisanFinTech-Hackathon/1.0


# =====================================================
# SOIL
# =====================================================

soil.api.enabled=true
soil.phosphorous.Black=10.0


# =====================================================
# SOIL MOISTURE
# =====================================================

soil.moisture.api.url=https://api.open-meteo.com/v1/forecast


# =====================================================
# MARKET DATA
# =====================================================

market.data.path=classpath:data/crop_price_dataset.csv


# =====================================================
# CORS
# =====================================================

cors.allowed-origins=http://localhost:5173


# =====================================================
# CROP PLANNER
# =====================================================

planner.region=Madhya Pradesh